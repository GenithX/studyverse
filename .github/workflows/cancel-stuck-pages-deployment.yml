name: Cancel stuck GitHub Pages deployment

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the deployment blocking Studyverse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/GenithX/studyverse/pages/deployments/56d7e4a9ab8c55a4201436a5c3443ab542467a9e/cancel"
          echo "Cancellation request accepted."
